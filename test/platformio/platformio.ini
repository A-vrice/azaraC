; PlatformIO compile test for azaraC (CI gate)
; Compiles the library via PlatformIO for the advertised boards.
; lib_deps = ../..  resolves to the repository root (azaraC library).

[env:uno]
platform = atmelavr@5.3.0
board = uno
framework = arduino
lib_deps = ../..
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
lib_deps = ../..
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
