# Issue のタイトル・本文のキーワードによるラベル自動付与（github/issue-labeler）
# 1 ラベル = 1 正規表現。同じラベルに複数書くと AND 条件になるので注意。
# 付与のみで、編集で条件から外れてもラベルは削除しない（sync-labels 既定 0）。
# 日本語と英語の両方を拾う。判別できない Issue はラベル無しのままにする。

# Renovate が作る Dependency Dashboard など。裸の "update" は README や文書の
# 更新にも当たるので、依存を示す語を伴うときだけ拾う。
dependencies:
  - '/(Dependency Dashboard|renovate|dependabot|依存関係|依存パッケージ|(ライブラリ|package|dependency|deps?)[^。\n]{0,20}(update|更新|bump|アップデート))/i'

# 注: 「不可」「エラー」は要望・質問の文にも現れる（「部分一致は不可ですか」「エラー処理を
# 改善してほしい」）。裸の1語では拾わず、複合語と不具合の文脈に限定する。
bug:
  - '/(バグ|不具合|誤り|誤動作|誤作動|発火|クラッシュ|落ちる|動かない|動きません|動作(しない|しません)|失敗|再現|破壊|壊れ|おかしい|ずれ|合わない|一致しない|できない|(使用|動作|利用|実行|読み込み|書き込み|取得|表示|認識|検出|送受信|接続|コンパイル)不可|エラー(が|を|で|に|発生)|\bbug\b|\bcrash|broken|\bfail|\berror\b|regression)/i'

documentation:
  - '/(ドキュメント|マニュアル|README|見ずらい|見づらい|誤記|誤変換|誤植|タイポ|\bdocumentation\b|\btypo)/i'
# 説明 は不具合報告（「説明どおりに動かない」）にも現れ、インストラクション は日本語の報告でまず使われないため、どちらも外した。
# 注: 一般的な "docs" は URL や Bot の定型文にも当たるため入れない

# 意図を表す動詞句としての 追加/対応/実装 だけを拾う（「不具合への対応」「仕様追加の
# 影響」のような名詞句で誤爆させない）。
enhancement:
  - '/(要望|提案|ほしい|欲しい|改善|サポート|\bfeature\b|\benhancement\b|\bsupport\b|(追加|対応|実装)(して|する|したい))/i'

question:
  - '/(質問|教示|教授|教えて|使い方|分からない|わからない|どうすれば|\bquestion\b|how\s+to)/i'
