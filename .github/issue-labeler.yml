# Issue のタイトル・本文のキーワードによるラベル自動付与（github/issue-labeler）
# 付与のみで、編集で条件から外れてもラベルは削除しない。
# 日本語と英語の両方を拾う。判別できない Issue はラベル無しのままにする。

# Renovate が作る Dependency Dashboard など。update単体はスコープを明示しないので依存を示す語を伴うときだけ拾う。
dependencies:
  - '/(Dependency Dashboard|renovate|dependabot|依存関係|依存パッケージ|(ライブラリ|\bpackages?\b|\bdependenc(y|ies)\b|\bdeps?\b)[^。\n]{0,20}(update|更新|bump|アップデート))/i'

# 注: 要望・質問と一部重なるため保守的な正規表現にとどめる。
bug:
  - '/(バグ|不具合|誤り|誤動作|誤作動|発火|クラッシュ|落ちる|動かない|動きません|動作(しない|しません)|失敗|再現|破壊|壊れ|おかしい|ずれ|合わない|一致しない|できない|(使用|動作|利用|実行|読み込み|書き込み|取得|表示|認識|検出|送受信|接続|コンパイル)不可|エラー(が|を|で|に|発生)|\bbug\b|\bcrash|broken|\bfail|\berror\b|regression)/i'

documentation:
  - '/(ドキュメント|マニュアル|README|見ずらい|見づらい|誤記|誤変換|誤植|タイポ|\bdocumentation\b|\btypo)/i'

enhancement:
  - '/(要望|提案|ほしい|欲しい|改善|サポート|\bfeature\b|\benhancement\b|\bsupport\b|(追加|対応|実装)(して|する|したい))/i'

question:
  - '/(質問|教示|教授|教えて|使い方|分からない|わからない|どうすれば|\bquestion\b|how\s+to)/i'
