name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # ソースアーカイブ生成（SLSA provenance の subject になる）
  build:
    name: Build source archive
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.archive.outputs.name }}
      subjects: ${{ steps.hash.outputs.subjects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Create source archive
        id: archive
        run: |
          TAG="${{ github.ref_name }}"
          NAME="azaraC-${TAG#v}"
          mkdir "$NAME"
          # 配布に必要なファイルのみ含める（.github, test, scripts は除外）
          cp -r src examples docs "$NAME/"
          cp README.md LICENSE library.properties keywords.txt "$NAME/" 2>/dev/null || true
          tar czf "${NAME}.tar.gz" "$NAME"
          zip -r "${NAME}.zip" "$NAME"
          echo "name=${NAME}" >> $GITHUB_OUTPUT

      - name: Compute subjects (base64)
        id: hash
        run: |
          TAG="${{ github.ref_name }}"
          NAME="azaraC-${TAG#v}"
          TAR_SHA=$(sha256sum "${NAME}.tar.gz" | cut -d' ' -f1)
          ZIP_SHA=$(sha256sum "${NAME}.zip" | cut -d' ' -f1)
          printf 'sha256:%s %s.tar.gz\nsha256:%s %s.zip\n' \
            "$TAR_SHA" "$NAME" "$ZIP_SHA" "$NAME" > subjects.txt
          echo "subjects=$(base64 -w0 subjects.txt)" >> $GITHUB_OUTPUT

      - name: Upload archive as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.archive.outputs.name }}
          path: |
            ${{ steps.archive.outputs.name }}.tar.gz
            ${{ steps.archive.outputs.name }}.zip

  # SLSA Level 3 provenance 生成
  provenance:
    needs: build
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.subjects }}"
      upload-assets: true

  # GitHub Release 作成 + アセットアップロード
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, provenance]
    permissions:
      contents: write
    steps:
      - name: Download source archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build.outputs.artifact-name }}

      - name: Upload assets and set release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # リリース本体は SLSA generator (upload-assets: true) が既に
          # 作成済み。provenance を壊さず tar.gz/zip を追加しメタデータを付与する。
          gh release upload "${{ github.ref_name }}" \
            ${{ needs.build.outputs.artifact-name }}.tar.gz \
            ${{ needs.build.outputs.artifact-name }}.zip
          # gh release edit に --generate-notes は無いため API で生成する。
          NOTES="$(gh api -X POST "repos/{owner}/{repo}/releases/generate-notes" \
            -f tag_name="${{ github.ref_name }}" --jq .body)"
          gh release edit "${{ github.ref_name }}" \
            --title "azaraC ${{ github.ref_name }}" \
            --notes "$NOTES"