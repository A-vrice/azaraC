name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # ソースアーカイブ生成（SLSA provenance の subject になる）
  build:
    name: Build source archive
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.archive.outputs.name }}
      subjects: ${{ steps.hash.outputs.subjects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Create source archive
        id: archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # タグは semver (vX.Y.Z) のみ許可。github.ref_name はシェル注入
          # ベクタのため、アーカイブ名に使う前に形式を検証する。
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Rejecting invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          NAME="azaraC-${RELEASE_TAG#v}"
          mkdir "$NAME"
          # 配布に必要なファイルのみ含める（.github, test, scripts は除外）
          cp -r src examples docs "$NAME/"
          cp README.md LICENSE library.properties keywords.txt "$NAME/" 2>/dev/null || true
          tar czf "${NAME}.tar.gz" "$NAME"
          zip -r "${NAME}.zip" "$NAME"
          echo "name=${NAME}" >> $GITHUB_OUTPUT

      - name: Compute subjects (base64)
        id: hash
        env:
          ARCHIVE_NAME: ${{ steps.archive.outputs.name }}
        run: |
          TAR_SHA=$(sha256sum "${ARCHIVE_NAME}.tar.gz" | cut -d' ' -f1)
          ZIP_SHA=$(sha256sum "${ARCHIVE_NAME}.zip" | cut -d' ' -f1)
          printf 'sha256:%s %s.tar.gz\nsha256:%s %s.zip\n' \
            "$TAR_SHA" "$ARCHIVE_NAME" "$ZIP_SHA" "$ARCHIVE_NAME" > subjects.txt
          echo "subjects=$(base64 -w0 subjects.txt)" >> $GITHUB_OUTPUT

      - name: Upload archive as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.archive.outputs.name }}
          path: |
            ${{ steps.archive.outputs.name }}.tar.gz
            ${{ steps.archive.outputs.name }}.zip

  # SLSA Level 3 provenance 生成
  provenance:
    needs: build
    permissions:
      actions: read
      id-token: write
      contents: write
    # fqdn は可変タグ v2.1.0 だと移動で未検証コード実行の恐れがあるため
    # コミット SHA に固定。更新は Renovate (pinGitHubActionDigests) が担う。
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.subjects }}"
      upload-assets: true

  # GitHub Release 作成 + アセットアップロード
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, provenance]
    permissions:
      contents: write
    steps:
      - name: Download source archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build.outputs.artifact-name }}

      - name: Upload assets and set release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          ARCHIVE_NAME: ${{ needs.build.outputs.artifact-name }}
        run: |
          # リリース本体は SLSA generator (upload-assets: true) が既に
          # 作成済み。provenance を壊さず tar.gz/zip を追加しメタデータを付与する。
          gh release upload "$RELEASE_TAG" \
            "${ARCHIVE_NAME}.tar.gz" \
            "${ARCHIVE_NAME}.zip"
          # gh release edit に --generate-notes は無いため API で生成する。
          NOTES="$(gh api -X POST "repos/{owner}/{repo}/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" --jq .body)"
          gh release edit "$RELEASE_TAG" \
            --title "azaraC $RELEASE_TAG" \
            --notes "$NOTES"