name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # ソースアーカイブ生成（SLSA provenance の subject になる）
  build:
    name: Build source archive
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.archive.outputs.name }}
      subjects: ${{ steps.hash.outputs.subjects }}
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # タグは annotated tag なので、github.sha がタグオブジェクトを指す可能性を避け、
      # checkout したコミットをそのまま記録する。
      - name: Record source commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Create source archive
        id: archive
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # タグは semver の vX.Y.Z 形式のみ許可。
          # シェルで直接展開せず環境変数として参照。
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Rejecting invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          # タグと manifest のバージョンはリリース時にしか突き合わせられない
          # （CI の version-sync は library.json と library.properties の同期まで）。
          # library.json は CI が同期を強制しているので properties だけで足りる。
          # .gitattributes が eol=lf なので改行コードの考慮は不要。
          if ! grep -qxF "version=${RELEASE_TAG#v}" library.properties; then
            echo "library.properties version does not match tag ${RELEASE_TAG}" >&2
            exit 1
          fi
          NAME="azaraC-${RELEASE_TAG#v}"
          mkdir "$NAME"
          # 本体及びその付属物
          cp -r src examples docs "$NAME/"
          # ライブラリとして配布すべきもの
          cp README.md LICENSE library.properties "$NAME/"
          # なくたっていい
          cp keywords.txt library.json "$NAME/" 2>/dev/null || true

          tar czf "${NAME}.tar.gz" "$NAME"
          zip -r "${NAME}.zip" "$NAME"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Compute subjects (base64)
        id: hash
        env:
          ARCHIVE_NAME: ${{ steps.archive.outputs.name }}
        run: |
          # slsa-generator の base64-subjects は sha256sum 出力形式（bare hex、接頭辞なし）を要求。sha256sum をそのまま使うのがこの形式と一致。
          sha256sum "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}.zip" > subjects.txt
          echo "subjects=$(base64 -w0 subjects.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload archive as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.archive.outputs.name }}
          path: |
            ${{ steps.archive.outputs.name }}.tar.gz
            ${{ steps.archive.outputs.name }}.zip

  # SLSA Level 3 provenance 生成
  provenance:
    needs: build
    permissions:
      actions: read
      id-token: write
      contents: write
    # 注意: slsa-github-generator の generic generator は SHA 参照をサポートしない。
    # 仕様上SHA参照だとビルドが失敗するため@X.Y.Z形式。更新は Renovate が担う。(ただしこのアクションの保守/更新は限定的なため、今後置き換え等も要検討)
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.subjects }}"
      # upload-assets は意図的に false（既定）のまま: generator に空リリースを作らせない。リリース作成は検証成功後に release ジョブが単独で担う。
      upload-assets: false
      # private-repository: true は必須の回避策。この generator (v2.1.0) は public
      # リポジトリを private と誤判定して停止することがある。public リポジトリなので
      # 公開透明性ログへのリポジトリ名露出は問題なし。d34256f で実際の失敗を受けて
      # 導入されたもので、消すと provenance ジョブが再び失敗する。
      private-repository: true

  # GitHub Release 作成 + アセットアップロード
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, provenance]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download source archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.build.outputs.artifact-name }}

      - name: Download SLSA provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}

      - name: Install slsa-verifier
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1

      - name: Verify SLSA provenance
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ARCHIVE_NAME: ${{ needs.build.outputs.artifact-name }}
        # provenance の署名、各ファイルの digest と subjectの一致、ソースリポジトリとタグの一致をそれぞれ検証する。
        # 失敗すればこのジョブで止まり、成果物はアップロードされない。
        # Builderとそこで生成されたprovenanceが侵害されない限り信頼できる
        run: |
          slsa-verifier verify-artifact \
            "${ARCHIVE_NAME}.tar.gz" \
            "${ARCHIVE_NAME}.zip" \
            --provenance-path "${{ needs.provenance.outputs.provenance-name }}" \
            --source-uri "github.com/A-vrice/azaraC" \
            --source-tag "$RELEASE_TAG"

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ needs.build.outputs.artifact-name }}.tar.gz
            ${{ needs.build.outputs.artifact-name }}.zip

      - name: Create draft, upload assets, and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          ARCHIVE_NAME: ${{ needs.build.outputs.artifact-name }}
          PROVENANCE: ${{ needs.provenance.outputs.provenance-name }}
          EXPECTED_SHA: ${{ needs.build.outputs.source-sha }}
        run: |
          set -euo pipefail

          # 空のリリースが残る可能性があるので若干過剰かもしれないけど対策。

          RELEASE_ID=""
          RELEASES_API="repos/${GH_REPO}/releases"

          fail() {
            printf '%s\n' "$*" >&2
            exit 1
          }

          # lightweight tag / annotated tag を commit まで解決する。
          verify_remote_tag() {
            local object type sha depth

            object="$(gh api \
              "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" \
              --jq '.object')" || return 1

            for ((depth = 0; depth < 16; depth++)); do
              type="$(jq -er '.type | strings' <<< "$object")" || return 1
              sha="$(jq -er '.sha | strings' <<< "$object")" || return 1

              case "$type" in
                commit)
                  if [[ "$sha" != "$EXPECTED_SHA" ]]; then
                    printf 'Tag commit mismatch: expected=%s actual=%s\n' \
                      "$EXPECTED_SHA" "$sha" >&2
                    return 1
                  fi
                  return 0
                  ;;
                tag)
                  object="$(gh api \
                    "repos/${GH_REPO}/git/tags/${sha}" \
                    --jq '.object')" || return 1
                  ;;
                *)
                  printf 'Unsupported tag target type: %s\n' "$type" >&2
                  return 1
                  ;;
              esac
            done

            printf '%s\n' "Tag nesting limit exceeded" >&2
            return 1
          }

          # この実行で作成した Release だけを対象にする。
          # 公開済み、または状態が不明な場合には削除しない。
          cleanup() {
            local status="$?"
            local draft

            trap - EXIT

            if [[ "$status" -ne 0 && "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]; then
              if draft="$(gh api \
                "${RELEASES_API}/${RELEASE_ID}" \
                --jq '.draft')"; then
                if [[ "$draft" == "true" ]]; then
                  if ! gh api --method DELETE \
                    "${RELEASES_API}/${RELEASE_ID}" \
                    --silent; then
                    printf '::warning::Could not delete draft release %s\n' \
                      "$RELEASE_ID" >&2
                  fi
                else
                  printf '::warning::Release %s is not a draft; leaving it untouched\n' \
                    "$RELEASE_ID" >&2
                fi
              else
                printf '::warning::Could not determine release %s state; leaving it untouched\n' \
                  "$RELEASE_ID" >&2
              fi
            fi

            exit "$status"
          }

          trap cleanup EXIT

          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || fail "Invalid release tag: $RELEASE_TAG"

          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || fail "Invalid source commit SHA: $EXPECTED_SHA"

          # このステップでは、カレントディレクトリ内の単純なファイル名だけを許可する。
          # パスや CLI の特殊入力として解釈される値を受け付けない。
          for name in "$ARCHIVE_NAME" "$PROVENANCE"; do
            [[ "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] \
              || fail "Invalid release asset name: $name"
          done

          assets=(
            "${ARCHIVE_NAME}.tar.gz"
            "${ARCHIVE_NAME}.zip"
            "$PROVENANCE"
          )

          [[ "$PROVENANCE" != "${assets[0]}" && "$PROVENANCE" != "${assets[1]}" ]] \
            || fail "Duplicate release asset name: $PROVENANCE"

          # アセット不足の場合には draft を作成しない。
          for file in "${assets[@]}"; do
            [[ -f "./$file" && -r "./$file" && -s "./$file" ]] \
              || fail "Missing, unreadable, or empty release asset: $file"
          done

          verify_remote_tag

          # 既存 Release は検索・流用せず、新規作成する。
          # タグが存在しなくなった場合の作成先も、ビルドした SHA に固定する。
          release="$(gh api --method POST \
            "$RELEASES_API" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$EXPECTED_SHA" \
            -f name="azaraC $RELEASE_TAG" \
            -F draft=true \
            -F generate_release_notes=true)"

          # 先に ID を保存し、以後の検証失敗も cleanup の対象にする。
          RELEASE_ID="$(jq -er \
            '.id | select(type == "number" and . > 0) | tostring' \
            <<< "$release")"

          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]] \
            || fail "Invalid release ID: $RELEASE_ID"

          jq -e --arg tag "$RELEASE_TAG" \
            '.draft == true and .tag_name == $tag' \
            <<< "$release" >/dev/null \
            || fail "Unexpected release creation response"

          upload_url="$(jq -er \
            '.upload_url | strings | select(length > 0) | split("{")[0]' \
            <<< "$release")"

          # タグ名で再検索せず、作成レスポンスの URL にアップロードする。
          # --input がある場合、-f の値はクエリパラメーターになる。
          for file in "${assets[@]}"; do
            case "$file" in
              *.tar.gz) content_type="application/gzip" ;;
              *.zip)    content_type="application/zip" ;;
              *)        content_type="application/octet-stream" ;;
            esac

            asset="$(gh api --method POST \
              "$upload_url" \
              -H "Content-Type: $content_type" \
              -f name="$file" \
              --input "./$file")"

            jq -e --arg name "$file" \
              '.state == "uploaded" and .name == $name and .size > 0' \
              <<< "$asset" >/dev/null \
              || fail "Unexpected upload response for asset: $file"
          done

          # 公開前に、この Release が依然として対象タグの draft であることを確認する。
          release="$(gh api "${RELEASES_API}/${RELEASE_ID}")"

          jq -e --arg tag "$RELEASE_TAG" \
            '.draft == true and .tag_name == $tag' \
            <<< "$release" >/dev/null \
            || fail "Release state changed before publication"

          # アップロード中のタグ変更も検出する。
          verify_remote_tag

          # 全アップロードと直前の検証が成功した場合にのみ公開する。
          release="$(gh api --method PATCH \
            "${RELEASES_API}/${RELEASE_ID}" \
            -F draft=false)"

          jq -e --arg tag "$RELEASE_TAG" \
            '.draft == false and .tag_name == $tag' \
            <<< "$release" >/dev/null \
            || fail "Unexpected release publication response"

          trap - EXIT
