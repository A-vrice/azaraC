name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # ソースアーカイブ生成（SLSA provenance の subject になる）
  build:
    name: Build source archive
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.archive.outputs.name }}
      subjects: ${{ steps.hash.outputs.subjects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Create source archive
        id: archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # タグは semver (vX.Y.Z) のみ許可。github.ref_name はシェル注入
          # ベクタのため、アーカイブ名に使う前に形式を検証する。
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Rejecting invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          NAME="azaraC-${RELEASE_TAG#v}"
          mkdir "$NAME"
          # 配布に必要なファイルのみ含める（.github, test, scripts は除外）
          cp -r src examples docs "$NAME/"
          cp README.md LICENSE library.properties keywords.txt "$NAME/" 2>/dev/null || true
          tar czf "${NAME}.tar.gz" "$NAME"
          zip -r "${NAME}.zip" "$NAME"
          echo "name=${NAME}" >> $GITHUB_OUTPUT

      - name: Compute subjects (base64)
        id: hash
        env:
          ARCHIVE_NAME: ${{ steps.archive.outputs.name }}
        run: |
          # slsa-generator の base64-subjects は sha256sum 出力形式（bare hex、
          # 接頭辞なし）を要求。sha256sum をそのまま使うのがこの形式と一致。
          sha256sum "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}.zip" > subjects.txt
          echo "subjects=$(base64 -w0 subjects.txt)" >> $GITHUB_OUTPUT

      - name: Upload archive as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.archive.outputs.name }}
          path: |
            ${{ steps.archive.outputs.name }}.tar.gz
            ${{ steps.archive.outputs.name }}.zip

  # SLSA Level 3 provenance 生成
  provenance:
    needs: build
    permissions:
      actions: read
      id-token: write
      contents: write
    # 注意: slsa-github-generator の generic generator は SHA 参照をサポート
    # しない。公式 README により「@vX.Y.Z 形式のタグ参照が MUST。SHA 参照だと
    # ビルドが失敗する」。更新は Renovate が担う。
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.subjects }}"
      # upload-assets は意図的に false（既定）のまま: generator に空リリースを
      # 作らせない。リリース作成は検証成功後に release ジョブが単独で担う。
      # private-repository: この generator (v2.1.0) は public リポジトリを
      # private と誤判定して停止することがある。public なので公開透明性ログ
      # へのリポジトリ名露出は問題なし。オーバーライドで誤判定ガードを外す。
      private-repository: true

  # GitHub Release 作成 + アセットアップロード
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, provenance]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download source archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build.outputs.artifact-name }}

      - name: Download SLSA provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}

      - name: Install slsa-verifier
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1

      - name: Verify SLSA provenance
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ARCHIVE_NAME: ${{ needs.build.outputs.artifact-name }}
        # provenance が本物で、tar.gz と zip の各 digest が subject と一致し、
        # ソースリポジトリ・タグが一致することを検証する。失敗すればこの
        # ジョブが止まり、成果物はアップロードされない。
        # （SLSA Level 3 の実証はここで確立される）
        run: |
          slsa-verifier verify-artifact \
            "${ARCHIVE_NAME}.tar.gz" \
            "${ARCHIVE_NAME}.zip" \
            --provenance-path "${{ needs.provenance.outputs.provenance-name }}" \
            --source-uri "github.com/A-vrice/azaraC" \
            --source-tag "$RELEASE_TAG"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            ${{ needs.build.outputs.artifact-name }}.tar.gz
            ${{ needs.build.outputs.artifact-name }}.zip

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # release ジョブは checkout しないため、gh は git remote から
          # リポジトリを解決できない。GH_REPO で明示する（CodeRabbit 対応）。
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          ARCHIVE_NAME: ${{ needs.build.outputs.artifact-name }}
          PROVENANCE: ${{ needs.provenance.outputs.provenance-name }}
        run: |
          # このステップに到達 = 上流の Verify SLSA provenance が検証成功。
          # リリース作成はここが単一の所有者。provenance 失敗時はこのジョブが
          # そもそも skipped になるため、空のリリースは残らない。
          # --verify-tag: タグが無い場合に gh がデフォルトブランチから自動作成
          # して別コミットへ公開するのを防ぐ（CodeRabbit 対応）。
          gh release create "$RELEASE_TAG" \
            "${ARCHIVE_NAME}.tar.gz" \
            "${ARCHIVE_NAME}.zip" \
            "$PROVENANCE" \
            --title "azaraC $RELEASE_TAG" \
            --generate-notes \
            --verify-tag