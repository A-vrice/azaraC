name: Update Definitions

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Get latest azarashi version
        id: ver
        run: |
          # PyPI JSON API (stable) instead of experimental `pip index` + fragile grep
          LATEST=$(curl -fsSL --retry 3 --retry-delay 2 --max-time 30 https://pypi.org/pypi/azarashi/json | jq -r '.info.version')
          if [[ -z "$LATEST" || "$LATEST" == "null" ]]; then
            echo "::error::Failed to determine latest azarashi version (PyPI API returned empty)" >&2
            exit 1
          fi
          CURRENT=$(cat .azarashi-version 2>/dev/null | tr -d '\n' || echo "0.0.0")
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          if [[ "$LATEST" != "$CURRENT" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Install azarashi
        if: steps.ver.outputs.changed == 'true'
        run: pip install "azarashi==${{ steps.ver.outputs.latest }}"

      - name: Generate definition headers
        if: steps.ver.outputs.changed == 'true'
        run: python scripts/gen/gen_definitions.py --out-dir src/definition

      # 生成物の検証ゲート。
      # 既定の GITHUB_TOKEN で作った PR は push では CI が起動せず、pull_request も
      # 「承認待ち」で止まる（GitHub の仕様）。無人実行では誰も承認しないため、
      # PR を作る前にここで落とす。トークン種別に依存しないのが利点。
      - name: Install host + AVR toolchain
        if: steps.ver.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make gcc-avr binutils-avr avr-libc

      - name: Gate - host unit tests
        if: steps.ver.outputs.changed == 'true'
        run: make -C test run

      - name: Gate - definition label buffer sizes
        if: steps.ver.outputs.changed == 'true'
        run: make -C test bench

      - name: Show definition diff summary
        if: steps.ver.outputs.changed == 'true'
        run: git diff --stat -- src/definition .azarashi-version

      - name: Setup Arduino CLI
        if: steps.ver.outputs.changed == 'true'
        uses: ./.github/actions/setup-arduino-cli
        with:
          additional_urls: >-
            https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Install required cores
        if: steps.ver.outputs.changed == 'true'
        run: |
          arduino-cli core install rp2040:rp2040
          arduino-cli core install esp32:esp32

      - name: Compile check
        if: steps.ver.outputs.changed == 'true'
        run: |
          LIB_DIR=$(arduino-cli config get directories.user)/libraries
          mkdir -p "$LIB_DIR"
          ln -s "$GITHUB_WORKSPACE" "$LIB_DIR/azaraC"

          for fqbn in \
            rp2040:rp2040:rpipico \
            rp2040:rp2040:rpipico2 \
            esp32:esp32:esp32s3
          do
            echo "=== $fqbn ==="
            arduino-cli compile --clean --fqbn "$fqbn" examples/basic_ubx \
              --build-property "compiler.cpp.extra_flags=-std=gnu++17"
          done

      - name: Create Pull Request
        if: steps.ver.outputs.changed == 'true'
        # 自動でフル CI も走らせたい場合は GitHub App トークン（contents: write / pull-requests: write）を
        # `token:` に渡す。既定の GITHUB_TOKEN では push が CI を起動せず、pull_request も承認待ちになる。
        # pull_request_target は使わない（フォーク由来コードに write トークン/シークレットを渡す pwn-request になる）。
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          title: "chore: update definitions (azarashi ${{ steps.ver.outputs.latest }})"
          branch: "auto/azarashi-${{ steps.ver.outputs.latest }}"
          commit-message: "auto-gen: definitions from azarashi ${{ steps.ver.outputs.latest }}"
          body: |
            ## Auto-generated definition update

            | | |
            |---|---|
            | Previous | `${{ steps.ver.outputs.current }}` |
            | New | `${{ steps.ver.outputs.latest }}` |

            Host tests (`make -C test run`) and the AVR label-size gate (`make -C test bench`) passed before this PR was created.

            Changes are in `src/definition/` (generated tables only; the two hand-written headers are listed in the generator's extra_headers and are not touched). Do not edit the generated files manually.
