name: Update Definitions

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 生成と検証は read 権限のみで実行する。PyPI 由来の azarashi（信頼外コード）を
  # import・実行するのはこのジョブだけ。write トークンを持つジョブには渡さない。
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.ver.outputs.changed }}
      latest: ${{ steps.ver.outputs.latest }}
      current: ${{ steps.ver.outputs.current }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Get latest azarashi version
        id: ver
        run: |
          # PyPI JSON API (stable) instead of experimental `pip index` + fragile grep
          LATEST=$(curl -fsSL --retry 3 --retry-delay 2 --max-time 30 https://pypi.org/pypi/azarashi/json | jq -r '.info.version')
          if [[ -z "$LATEST" || "$LATEST" == "null" ]]; then
            echo "::error::Failed to determine latest azarashi version (PyPI API returned empty)" >&2
            exit 1
          fi
          CURRENT=$(cat .azarashi-version 2>/dev/null | tr -d '\n' || echo "0.0.0")
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          if [[ "$LATEST" != "$CURRENT" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Install azarashi
        if: steps.ver.outputs.changed == 'true'
        run: pip install "azarashi==${{ steps.ver.outputs.latest }}"

      - name: Generate definition headers
        if: steps.ver.outputs.changed == 'true'
        run: python scripts/gen/gen_definitions.py --out-dir src/definition

      # 生成物の検証ゲート。
      # 既定の GITHUB_TOKEN で作った PR は push では CI が起動せず、pull_request も
      # 「承認待ち」で止まる（GitHub の仕様）。無人実行では誰も承認しないため、
      # PR を作る前にここで落とす。トークン種別に依存しないのが利点。
      - name: Install host + AVR toolchain
        if: steps.ver.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make gcc-avr binutils-avr avr-libc cppcheck

      - name: Gate - host unit tests
        if: steps.ver.outputs.changed == 'true'
        run: make -C test run

      - name: Gate - definition label buffer sizes
        if: steps.ver.outputs.changed == 'true'
        run: make -C test bench

      - name: Gate - static analysis (cppcheck + strict warnings)
        if: steps.ver.outputs.changed == 'true'
        run: make -C test check

      - name: Show definition diff summary
        if: steps.ver.outputs.changed == 'true'
        run: git diff --stat -- src/definition .azarashi-version

      - name: Setup Arduino CLI
        if: steps.ver.outputs.changed == 'true'
        uses: ./.github/actions/setup-arduino-cli
        with:
          additional_urls: >-
            https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Install required cores
        if: steps.ver.outputs.changed == 'true'
        run: |
          arduino-cli core install rp2040:rp2040
          arduino-cli core install esp32:esp32

      - name: Compile check
        if: steps.ver.outputs.changed == 'true'
        run: |
          LIB_DIR=$(arduino-cli config get directories.user)/libraries
          mkdir -p "$LIB_DIR"
          ln -s "$GITHUB_WORKSPACE" "$LIB_DIR/azaraC"

          for fqbn in \
            rp2040:rp2040:rpipico \
            rp2040:rp2040:rpipico2 \
            esp32:esp32:esp32s3
          do
            echo "=== $fqbn ==="
            arduino-cli compile --clean --fqbn "$fqbn" examples/basic_ubx \
              --build-property "compiler.cpp.extra_flags=-std=gnu++17"
          done

      # 生成物（データのみ）を artifact にして write ジョブへ渡す。
      # tar で src/definition と .azarashi-version のパス構造を保つ。
      - name: Package generated definitions
        if: steps.ver.outputs.changed == 'true'
        run: tar czf definitions.tar.gz src/definition .azarashi-version

      - name: Upload generated definitions
        if: steps.ver.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: generated-definitions
          path: definitions.tar.gz
          retention-days: 1

  # write 権限を持つのはこのジョブだけ。信頼外コード（pip/python/make）は一切実行せず、
  # 検証済み artifact を展開して PR を作るだけにする。
  pr:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download generated definitions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: generated-definitions

      - name: Extract generated definitions
        run: tar xzf definitions.tar.gz

      - name: Create Pull Request
        # 自動でフル CI も走らせたい場合は GitHub App トークン（contents: write / pull-requests: write）を
        # `token:` に渡す。既定の GITHUB_TOKEN では push が CI を起動せず、pull_request も承認待ちになる。
        # pull_request_target は使わない（フォーク由来コードに write トークン/シークレットを渡す pwn-request になる）。
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          title: "chore: update definitions (azarashi ${{ needs.generate.outputs.latest }})"
          branch: "auto/azarashi-${{ needs.generate.outputs.latest }}"
          commit-message: "auto-gen: definitions from azarashi ${{ needs.generate.outputs.latest }}"
          body: |
            ## Auto-generated definition update

            | | |
            |---|---|
            | Previous | `${{ needs.generate.outputs.current }}` |
            | New | `${{ needs.generate.outputs.latest }}` |

            Host tests (`make -C test run`), the AVR label-size gate (`make -C test bench`), and static analysis (`make -C test check`: cppcheck + `-Werror`) passed in the read-only `generate` job before this PR was created. The `pr` job only extracts the verified artifact and opens the PR; it runs no untrusted code.

            Changes are in `src/definition/` (generated tables only; the two hand-written headers are listed in the generator's extra_headers and are not touched). Do not edit the generated files manually.
