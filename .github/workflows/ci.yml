name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-sync:
    name: Version sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check library.json / library.properties version sync
        run: |
          JSON_VER=$(jq -r .version library.json)
          PROP_VER=$(grep -E '^version=' library.properties | cut -d= -f2 | tr -d '\r')
          echo "library.json: $JSON_VER"
          echo "library.properties: $PROP_VER"
          if [[ "$JSON_VER" != "$PROP_VER" ]]; then
            echo "::error::Version mismatch: library.json ($JSON_VER) != library.properties ($PROP_VER)"
            exit 1
          fi
          echo "Version sync OK: $JSON_VER"
  host-test:
    name: Host unit tests (g++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build & run
        run: |
          set -o pipefail
          make -C test run 2>&1 | tee host-test.log

      - name: Test counts (step summary)
        if: always()
        run: |
          {
            echo '### Host tests'
            echo '```'
            grep -E '^\[doctest\] (test cases|assertions):' host-test.log || echo 'doctest summary not found'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build & run (reduced page budget, AZARAC_NANKAI_MAX_PAGES=8)
        run: make -C test run-small-pages

      - name: Build & run (dedup disabled, AZARAC_ENABLE_DEDUP=0)
        run: make -C test run-dedup-off

      - name: Build & run (LTO, -O2 -flto)
        run: make -C test run-lto

      - name: Build & run (JA-only and EN-only language configs)
        run: make -C test run-lang-defaults

      - name: Build & run (no dynamic allocation check)
        run: make -C test test-no-alloc

      # dedup ベンチ（test/bench/run_dedup_bench.sh）: NEW_RECALL / DUP_SUPPRESS / NANKAI_KEY_STABLE / PREAMBLE_KEY_STABLE をゲート。host の g++ だけで動く。
      - name: Dedup benchmark (gates)
        run: make -C test bench-dedup

      # 定義テーブルの AVR フットプリント計測（autoresearch.sh は avr-gcc/avr-size/avr-nm を使う）。
      - name: Install AVR toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-avr binutils-avr avr-libc

      - name: Definition-table footprint benchmark (gates)
        run: make -C test bench

      - name: AVR ABI layout (Nankai/dedup)
        run: make -C test avr-layout

      - name: AVR-style stub build (PROGMEM, 16-bit int)
        run: make -C test pgm-stub

      - name: Arduino interrupt-state test (ARDUINO=1, AVR branch)
        run: make -C test test-time-irq

  sanitizer:
    name: ASan/UBSan (g++)
    runs-on: ubuntu-latest
    # 動的なメモリ・UB 検出はここが唯一なのでゲートにする。
    # cppcheck / coverage / LTO と合わせて、失敗は PR を止める。
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build & run with ASan/UBSan
        run: |
          make -C test run \
            CXXFLAGS_EXTRA="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            LDFLAGS="-fsanitize=address,undefined"

  # azarashi由来。バージョン間で互換性の内部表現があるためこちらで補正
  fixture-drift:
    name: Generated fixture drift
    runs-on: ubuntu-latest
    needs: [host-test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Regenerate the Nankai page header from the committed JSON
        run: python test/scripts/gen_all_vectors.py --nankai-header-only

      - name: Verify committed fixtures match the generator
        run: git diff --exit-code -- test/data/nankai_pages_generated.h

      # timestamp は生成時刻で毎回変わるため、ハッシュは決まったフィールドだけを対象にする。
      - name: Verify nankai_vectors.json deterministic fields
        run: python test/scripts/hash_nankai_vectors.py --check

  fuzz-test:
    name: Fuzz testing
    runs-on: ubuntu-latest
    needs: host-test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run fuzz test
        run: make -C test fuzz FUZZ_ITERATIONS=1000000

  arduino-lint:
    name: Arduino Lint
    runs-on: ubuntu-latest
    needs: host-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Arduino Lint
        uses: arduino/arduino-lint-action@9a3603836c75e41753e531167395edeb90ba5dae # v3.0.0
        with:
          library-manager: update
          compliance: strict

  # 必須コンパイルチェック（リリースゲート）: アーキテクチャごとに主要そうなボードを 1-2 個
  # その他ボードは compile-extended（ベストエフォート）。
  arduino-compile-required:
    name: compile required (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs:
      - host-test
      - arduino-lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: RP2040 Pico
            core: rp2040:rp2040
            fqbn: rp2040:rp2040:rpipico
            additional_urls: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
            build_flags: ""

          - name: ESP32-C3
            core: esp32:esp32
            fqbn: esp32:esp32:esp32c3
            additional_urls: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
            build_flags: ""

          - name: Arduino Uno
            core: arduino:avr
            fqbn: arduino:avr:uno
            additional_urls: ""
            # Uno (32 KB Flash / 2 KB SRAM) cannot hold all definition pools (~248 KB all-category; docs/architecture.md): the AVR preset in azaraC_config.h keeps SEISMIC/TSUNAMI only (~3.4 KB tables) so the sketches fit.
            build_flags: ""

          - name: Arduino Mega 2560
            core: arduino:avr
            fqbn: arduino:avr:mega
            additional_urls: ""
            # Mega の場合 Flash 自体は 256 KB あるものの、アーキテクチャは AVR のためプリセットでは DCX/CAMF は Uno と同じく既定で無効
            # Mega での DCX/CAMF のコンパイルは別工程で検証
            build_flags: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Arduino CLI
        uses: ./.github/actions/setup-arduino-cli
        with:
          additional_urls: ${{ matrix.additional_urls }}

      - name: Install core
        run: arduino-cli core install "${{ matrix.core }}"

      - name: Compile examples
        run: |
          LIB_DIR=$(arduino-cli config get directories.user)/libraries
          mkdir -p "$LIB_DIR"
          ln -s "$GITHUB_WORKSPACE" "$LIB_DIR/azaraC"
          for sketch in examples/*/; do
            echo "--- $sketch ---"
            sketch_name=$(basename "$sketch")
            # Arduino Uno: only the basic examples are AVR-aware (they use Serial instead of Serial1 and the AVR preset reduces the enabled categories).
            # The other examples need Serial1 or more flash/RAM than the Uno has.
            if [[ "${{ matrix.name }}" == "Arduino Uno" && "$sketch_name" != "basic_ubx" && "$sketch_name" != "basic_nmea" && "$sketch_name" != "basic_uno" ]]; then
              echo "skip $sketch_name on ${{ matrix.name }} (not AVR-aware)"
              continue
            fi
            # Skip WiFi examples on boards without WiFi (requires WiFi.h)
            if [[ ("${{ matrix.name }}" == "RP2040 Pico" || "${{ matrix.name }}" == "Arduino Mega 2560") && ("$sketch_name" == "wifi_client" || "$sketch_name" == "with_sntp") ]]; then
              echo "skip $sketch_name on ${{ matrix.name }} because WiFi.h is unavailable"
              continue
            fi
            # Skip RTOS example on non-ESP32 boards (requires FreeRTOS)
            if [[ "$sketch_name" == "rtos_freertos" && "${{ matrix.name }}" != "ESP32-C3" && "${{ matrix.name }}" != "ESP32-S3" ]]; then
              echo "skip $sketch_name on ${{ matrix.name }} (requires ESP32 FreeRTOS)"
              continue
            fi
            CPP_EXTRA_FLAGS="-std=gnu++17 ${{ matrix.build_flags }}"
            # Added --clean to invalidate build cache
            arduino-cli compile --clean --fqbn "${{ matrix.fqbn }}" "$sketch" --build-property "compiler.cpp.extra_flags=$CPP_EXTRA_FLAGS"
          done

  # 拡張コンパイルチェック（ベストエフォート）: required 以外のボード。こちらはCIをブロックしない
  arduino-compile-extended:
    name: compile extended (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs:
      - host-test
      - arduino-lint
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: RP2350 Pico 2
            slug: pico2
            core: rp2040:rp2040
            fqbn: rp2040:rp2040:rpipico2
            additional_urls: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
            build_flags: ""

          - name: ESP32-S3
            slug: esp32s3
            core: esp32:esp32
            fqbn: esp32:esp32:esp32s3
            additional_urls: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
            build_flags: ""

          - name: STM32 Nucleo H563ZI
            slug: stm32h563
            core: STMicroelectronics:stm32
            fqbn: STMicroelectronics:stm32:Nucleo_144:pnum=NUCLEO_H563ZI
            additional_urls: https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json
            build_flags: "-DENABLE_HWSERIAL1 -DPIN_SERIAL_RX=PA9 -DPIN_SERIAL_TX=PA10"

          - name: Arduino GIGA R1 WiFi
            slug: giga
            core: arduino:mbed_giga
            fqbn: arduino:mbed_giga:giga
            additional_urls: https://downloads.arduino.cc/packages/package_index.json
            build_flags: ""

          - name: nRF52840 Nano 33 BLE
            slug: nano33ble
            core: arduino:mbed_nano
            fqbn: arduino:mbed_nano:nano33ble
            additional_urls: https://downloads.arduino.cc/packages/package_index.json
            build_flags: ""

          - name: Teensy 4.0
            slug: teensy40
            core: teensy:avr
            fqbn: teensy:avr:teensy40
            additional_urls: https://www.pjrc.com/teensy/package_teensy_index.json
            build_flags: ""

          - name: RP2040 Pico W
            slug: picow
            core: rp2040:rp2040
            fqbn: rp2040:rp2040:rpipicow
            additional_urls: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
            build_flags: ""

          - name: Arduino Zero
            slug: zero
            core: arduino:samd
            fqbn: arduino:samd:arduino_zero_native
            additional_urls: https://downloads.arduino.cc/packages/package_index.json
            build_flags: "-DAZARAC_ENABLE_NANKAI=0 -DAZARAC_ENABLE_DCX_CAMF=0 -DAZARAC_ENABLE_VOLCANO=0 -DAZARAC_ENABLE_ASH_FALL=0 -DAZARAC_ENABLE_WEATHER=0 -DAZARAC_ENABLE_FLOOD=0 -DAZARAC_ENABLE_TYPHOON=0 -DAZARAC_ENABLE_MARINE=0 -DAZARAC_ENABLE_NW_PAC_TSUNAMI=0"


    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Arduino CLI
        uses: ./.github/actions/setup-arduino-cli
        with:
          additional_urls: ${{ matrix.additional_urls }}

      - name: Install core
        run: arduino-cli core install "${{ matrix.core }}"

      - name: Patch core headers for chrono macro conflicts
        if: >-
          matrix.name == 'STM32 Nucleo H563ZI' ||
          matrix.name == 'nRF52840 Nano 33 BLE' ||
          matrix.name == 'Arduino GIGA R1 WiFi'
        run: |
          # Wrap #include <chrono> with pragma push_macro/pop_macro to isolate macro conflicts
          PATCH_SCRIPT='s/#include <chrono>/#pragma push_macro("abs")\n#pragma push_macro("min")\n#pragma push_macro("max")\n#pragma push_macro("round")\n#undef abs\n#undef min\n#undef max\n#undef round\n#include <chrono>\n#pragma pop_macro("round")\n#pragma pop_macro("max")\n#pragma pop_macro("min")\n#pragma pop_macro("abs")/'
          # Apply to all headers and sources in the installed cores.
          # 0 件ならコア構成が変わってこのワークアラウンドが不要になったということなので、
          # 黙って通さず失敗させる（sed 自体の失敗も bash -e で止まる）。
          patched=0
          while IFS= read -r -d '' f; do
            if grep -q '#include <chrono>' "$f"; then
              sed -i "$PATCH_SCRIPT" "$f"
              patched=$((patched + 1))
            fi
          done < <(find ~/.arduino15/packages/ -type f \( -name "*.h" -o -name "*.cpp" -o -name "*.c" \) -print0)
          echo "patched $patched file(s)"
          if [[ "$patched" -eq 0 ]]; then
            echo "::error::no core source contained '#include <chrono>'; the chrono macro patch is obsolete or the core layout changed"
            exit 1
          fi

      - name: Compile examples
        id: compile
        run: |
          LIB_DIR=$(arduino-cli config get directories.user)/libraries
          mkdir -p "$LIB_DIR"
          ln -s "$GITHUB_WORKSPACE" "$LIB_DIR/azaraC"
          for sketch in examples/*/; do
            echo "--- $sketch ---"
            sketch_name=$(basename "$sketch")
            if [[ ("${{ matrix.name }}" == "Arduino GIGA R1 WiFi") || ("${{ matrix.name }}" == "Teensy 4.0" || "${{ matrix.name }}" == "STM32 Nucleo H563ZI" || "${{ matrix.name }}" == "nRF52840 Nano 33 BLE" || "${{ matrix.name }}" == "Arduino Zero" || "${{ matrix.name }}" == "RP2350 Pico 2") && ("$sketch_name" == "wifi_client" || "$sketch_name" == "with_sntp") ]]; then
              if [[ "${{ matrix.name }}" == "Arduino GIGA R1 WiFi" ]]; then
                if [[ "$sketch_name" == "with_sntp" ]]; then
                  echo "skip $sketch_name on ${{ matrix.name }} because configTime is unavailable"
                  continue
                fi
              else
                echo "skip $sketch_name on ${{ matrix.name }} because WiFi.h is unavailable"
                continue
              fi
            fi
            # Skip RTOS example on non-ESP32 boards (requires FreeRTOS)
            if [[ "$sketch_name" == "rtos_freertos" && "${{ matrix.name }}" != "ESP32-C3" && "${{ matrix.name }}" != "ESP32-S3" ]]; then
              echo "skip $sketch_name on ${{ matrix.name }} (requires ESP32 FreeRTOS)"
              continue
            fi
            CPP_EXTRA_FLAGS="-std=gnu++17 ${{ matrix.build_flags }}"
            if [[ "${{ matrix.fqbn }}" == *"rpipicow"* ]]; then
              arduino-cli compile --clean --fqbn "${{ matrix.fqbn }}" "$sketch" \
                --build-property "compiler.cpp.extra_flags=$CPP_EXTRA_FLAGS" \
                --build-property "build.filesystem_size=1.0"
            else
              arduino-cli compile --clean --fqbn "${{ matrix.fqbn }}" "$sketch" \
                --build-property "compiler.cpp.extra_flags=$CPP_EXTRA_FLAGS"
            fi
          done

      - name: Record compile outcome
        if: always()
        run: echo "${{ steps.compile.outcome }}" > extended_outcome.txt

      - name: Upload extended outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: extended-outcome-${{ matrix.slug }}
          path: extended_outcome.txt

  # PlatformIO コンパイルテスト: test/platformio の lib_deps = ../.. で作業ツリーを uno/esp32dev でコンパイルすることを検証する。
  # Registry には 2.0.0 が公開済み（2026-10-15）なので、Registry からの解決を確かめるテストは別途追加できる。
  platformio-compile:
    name: PlatformIO compile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install PlatformIO
        run: pip install -r scripts/requirements.txt

      - name: Compile (uno, esp32dev)
        run: pio run -d test/platformio

  macro-size-check:
    name: Macro size check
    runs-on: ubuntu-latest
    needs: host-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Compile with all macros disabled
        run: make -C test test-macro-compile

      - name: Measure macro size impact
        run: |
          set -o pipefail
          status=0
          make -C test test-macro-sizes 2>&1 | tee test/macro_sizes.txt || status=$?
          echo "### 📐 AZARAC_ENABLE_* Macro Size Impact" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Host g++ (-O0) .text bytes — relative comparison only; optimized builds are much smaller." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat test/macro_sizes.txt >> $GITHUB_STEP_SUMMARY
          exit $status

  macro-runtime-test:
    name: Macro disable runtime tests
    runs-on: ubuntu-latest
    needs: host-test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run all 13 individual macro-disabled runtime tests
        run: make -C test macro

  static-analysis:
    name: Static analysis (cppcheck)
    runs-on: ubuntu-latest
    needs: host-test
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Static code analysis (XML output)
        run: make -C test check-xml

      - name: Strict compilation check
        run: make -C test check-strict-compile

      - name: Generate cppcheck summary
        if: always()
        run: python scripts/analysis/cppcheck_summary.py --input-xml test/cppcheck_report.xml >> $GITHUB_STEP_SUMMARY

      - name: Upload cppcheck report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cppcheck-report
          path: test/cppcheck_report.xml

  coverage:
    name: Coverage (gcovr)
    runs-on: ubuntu-latest
    needs: host-test
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      HAS_CODACY_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install gcovr
        run: sudo apt-get update && sudo apt-get install -y gcovr

      - name: Build & run with coverage
        run: make -C test coverage

      - name: Generate gcovr reports
        run: |
          cd test && gcovr . --filter='../src/' --exclude='.*test_.*\.cpp' --exclude='.*definition.*' \
            --json coverage_report.json --json-pretty \
            --xml coverage.xml --xml-pretty

      - name: Generate coverage step summary
        run: python scripts/analysis/gcovr_summary.py --input test/coverage_report.json >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: test/coverage_report.json

      - name: Upload coverage to Codacy
        if: ${{ env.HAS_CODACY_TOKEN == 'true' }}
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: test/coverage.xml
          language: cpp

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - host-test
      - fixture-drift
      - fuzz-test
      - arduino-lint
      - arduino-compile-required
      - arduino-compile-extended
      - macro-size-check
      - macro-runtime-test
      - static-analysis
      - coverage
      - platformio-compile
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download cppcheck report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cppcheck-report
          path: artifacts/cppcheck

      - name: Download coverage report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-report
          path: artifacts/coverage

      - name: Download extended outcomes
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: extended-outcome-*
          path: artifacts/extended

      - name: Generate comment body
        run: |
          cat  << 'EOF' > comment.md
          ## CI Results

          | Job | Status |
          |-----|--------|
          EOF
          echo "| host-test | ${{ needs.host-test.result }} |" >> comment.md
          echo "| fixture-drift | ${{ needs.fixture-drift.result }} |" >> comment.md
          echo "| fuzz-test | ${{ needs.fuzz-test.result }} |" >> comment.md
          echo "| arduino-lint | ${{ needs.arduino-lint.result }} |" >> comment.md
          echo "| arduino-compile-required | ${{ needs.arduino-compile-required.result }} |" >> comment.md
          failed=0; total=0
          # arduino-compile-extended のマトリクス件数は slug: フィールド（extended 専用）から数える。
          # マトリクスを増減してもこの行は触らない（required 側に slug: は無い）。
          # アンカー '^ *' 必須: このコメント行と下の行自身も 'slug:' を含むため、
          # 裸の grep だと 8+3=11 を数えて常に 3 missing と誤表示する。
          expected=$(grep -c '^ *slug:' .github/workflows/ci.yml)
          for f in artifacts/extended/*/extended_outcome.txt; do
            [ -f "$f" ] || continue
            total=$((total+1))
            [ "$(cat "$f")" = "success" ] || failed=$((failed+1))
          done
          missing=$((expected-total))
          if [ "$total" -eq 0 ]; then
            ext_status="not run"
          elif [ "$missing" -gt 0 ]; then
            ext_status="failure ($failed/$total boards, $missing missing)"
          elif [ "$failed" -eq 0 ]; then
            ext_status="success"
          else
            ext_status="failure ($failed/$total boards)"
          fi
          echo "| arduino-compile-extended | $ext_status |" >> comment.md
          echo "| macro-size-check | ${{ needs.macro-size-check.result }} |" >> comment.md
          echo "| macro-runtime-test | ${{ needs.macro-runtime-test.result }} |" >> comment.md
          echo "| static-analysis | ${{ needs.static-analysis.result }} |" >> comment.md
          echo "| coverage | ${{ needs.coverage.result }} |" >> comment.md
          echo "| platformio-compile | ${{ needs.platformio-compile.result }} |" >> comment.md
          echo "" >> comment.md
          echo "---" >> comment.md
          echo "" >> comment.md

          # Gcovr coverage summary
          if [ -f artifacts/coverage/coverage_report.json ]; then
            python scripts/analysis/gcovr_summary.py --input artifacts/coverage/coverage_report.json >> comment.md
          else
            echo "### 📊 Coverage Report" >> comment.md
            echo "" >> comment.md
            echo "⚠️ Coverage report not available (coverage job was skipped or failed)." >> comment.md
            echo "" >> comment.md
          fi

          echo "" >> comment.md
          echo "---" >> comment.md
          echo "" >> comment.md

          # Cppcheck summary
          if [ -f artifacts/cppcheck/cppcheck_report.xml ]; then
            python scripts/analysis/cppcheck_summary.py --input-xml artifacts/cppcheck/cppcheck_report.xml >> comment.md
          else
            echo "### 🔍 Cppcheck Static Analysis Results" >> comment.md
            echo "" >> comment.md
            echo "⚠️ Cppcheck report not available (static-analysis job was skipped or failed)." >> comment.md
            echo "" >> comment.md
          fi

      - name: Write to GITHUB_STEP_SUMMARY
        run: cat comment.md >> $GITHUB_STEP_SUMMARY

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment ${{ github.event.number }} --edit-last --create-if-none --body-file comment.md || true
