sentence=QZSS L1S DCX/CAMF and QZQSM decoder for Arduino
paragraph=Decodes QZSS L1S disaster alert messages from UBX (RXM-SFRBX) or NMEA ($QZQSM). All 12 JMA DC Report sub-types supported. Definition tables auto-generated from azarashi. No heap allocation. No external dependencies. Corresponds to IS-QZSS-DCR-016 (MT=43, all 12 categories), IS-QZSS-DCX-004 and EWSS-CAMF v1.1 (MT=44). Definition tables are auto-generated from azarashi 0.16.4.
category=Communication
