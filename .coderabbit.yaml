language: "ja"
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  path_filters:
    - "!test/cppcheck_report.xml"
    - "!test/coverage_report.json"
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "develop"
chat:
  auto_reply: true
